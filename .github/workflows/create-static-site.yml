name: Create Static.app Site

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Static.app subdomain (lowercase a-z, at most one hyphen, no digits)"
        required: true
        default: "county-policescannertoday"

jobs:
  create-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create site on Static.app
        env:
          STATIC_APP_API_KEY: ${{ secrets.STATIC_APP_API_KEY }}
        run: |
          cd static-app
          zip -r ../site.zip .
          cd ..
          curl -sS -f -X POST "https://api.static.app/v1/sites/zip" -H "Authorization: Bearer $STATIC_APP_API_KEY" -F "archive=@site.zip" -F "domain=${{ inputs.domain }}"
